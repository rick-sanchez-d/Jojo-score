<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JoJoScore – Live Football Scores</title>
<style>
:root{--bg:#0f0a1c;--card:#1a1230;--ink:#f1eaff;--mute:#a495c4;--acc:#a371ff;--gold:#ffc83d;--live:#ff4d78;--line:#2d2250}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}
header{background:linear-gradient(90deg,#4b1fa8,#8a3ffc);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:20px;font-style:italic;letter-spacing:2px}h1 b{color:var(--gold)}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto}
button,input,select{font:inherit;color:var(--ink)}
nav button,.btn{background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap}
nav .on,.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:720px;margin:0 auto;padding:0 12px 40px}
.lg{margin:14px 0 6px;color:var(--gold);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;cursor:pointer}
.t{font-size:12px;color:var(--mute);text-align:center}.live{color:var(--live);font-weight:700}
.tm div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}.w{font-weight:700}
.star{background:none;border:0;font-size:20px;color:var(--mute);cursor:pointer}.star.on{color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.big{display:flex;justify-content:space-around;align-items:center;text-align:center;font-weight:700}.big .s{font-size:32px;color:var(--acc)}
.bar{margin:10px 0}.bar .l{display:flex;justify-content:space-between;font-size:13px}
.tr{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}.a{background:var(--acc)}.b{background:var(--gold)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mute);font-size:12px}
input,select{width:100%;padding:10px;margin:6px 0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.note{font-size:12px;color:var(--mute)}a{color:var(--acc);cursor:pointer}
</style></head><body>
<header><h1>JOJO<b>SCORE</b></h1><span id="who" class="note"></span></header>
<nav id="nav"></nav><main id="app"></main>
<script>
let tab="today",date=new Date().toISOString().slice(0,10),league=39,token=localStorage.jt||"",user=null,favs=[],cur=null;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get=async u=>{const r=await fetch(u);return r.json()};
const post=async(u,b)=>{const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify(b)});return r.json()};
const LG=[[39,"Premier League"],[140,"La Liga"],[135,"Serie A"],[78,"Bundesliga"],[61,"Ligue 1"],[2,"Champions League"]];
function nav(){$("#nav").innerHTML=[["today","Matches"],["live","Live"],["table","Standings"],["me","Account"]].map(x=>`<button class="${tab===x[0]?"on":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("");$("#who").textContent=user||"Guest"}
function go(t){tab=t;cur=null;draw()}
function when(f){const s=f.fixture.status.short;return["1H","2H","ET","P","LIVE"].includes(s)?`<span class="live">${f.fixture.status.elapsed}'</span>`:s==="HT"?'<span class="live">HT</span>':s==="NS"?new Date(f.fixture.date).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):s}
function row(f){const id=f.fixture.id,s=favs.includes(id),h=f.goals.home>f.goals.away,a=f.goals.away>f.goals.home;
return `<div class="m" onclick="show(${id})"><div class="t">${when(f)}</div><div class="tm"><div class="${h?"w":""}"><span>${esc(f.teams.home.name)}</span><span>${f.goals.home??"-"}</span></div><div class="${a?"w":""}"><span>${esc(f.teams.away.name)}</span><span>${f.goals.away??"-"}</span></div></div><button class="star ${s?"on":""}" onclick="event.stopPropagation();fav(${id})">${s?"★":"☆"}</button></div>`}
function list(r){if(!r||!r.length)return'<p class="note">No matches found.</p>';let g="",last="";r.sort((x,y)=>x.league.name.localeCompare(y.league.name)).forEach(f=>{if(f.league.name!==last){g+=`<div class="lg">${esc(f.league.country)} · ${esc(f.league.name)}</div>`;last=f.league.name}g+=row(f)});return g}
async function fav(id){if(!token){go("me");return}favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];await post("/api/fav",{favs});draw()}
async function show(id){cur=id;$("#app").innerHTML='<p class="note">Loading…</p>';const [d,s]=await Promise.all([get("/api/fixtures?date="+date),get("/api/stats?id="+id)]);
const f=(window.last||[]).find(x=>x.fixture.id===id);const st=s.response||[];
const names=[...new Set(st.flatMap(t=>t.statistics.map(x=>x.type)))];
const v=(t,n)=>{const x=t?.statistics.find(y=>y.type===n);return parseInt(x?.value)||0};
const want=["Corner Kicks","Shots on Goal","Total Shots","Fouls","Yellow Cards","Offsides","Ball Possession"];
const bars=want.filter(n=>names.includes(n)).map(n=>{const a=v(st[0],n),b=v(st[1],n),t=(a+b)||1;return `<div class="bar"><div class="l"><span>${a}</span><span>${n}</span><span>${b}</span></div><div class="tr"><div class="a" style="width:${a/t*100}%"></div><div class="b" style="width:${b/t*100}%"></div></div></div>`}).join("");
const wood=names.find(n=>/wood|post|bar/i.test(n));
$("#app").innerHTML=`<p><a onclick="go(tab)">← Back</a></p>${f?`<div class="card"><div class="note">${esc(f.league.name)}</div><div class="big"><div>${esc(f.teams.home.name)}</div><div class="s">${f.goals.home??"-"} - ${f.goals.away??"-"}</div><div>${esc(f.teams.away.name)}</div></div></div>`:""}
<div class="card"><b>Match stats</b>${bars||'<p class="note">Stats not available yet for this match.</p>'}${wood?"":'<p class="note">Crossbar / woodwork hits are not provided by this data source.</p>'}</div>`}
async function draw(){nav();const a=$("#app");
if(cur)return;
if(tab==="today"){a.innerHTML=`<input type="date" value="${date}" onchange="date=this.value;draw()"><p class="note">Loading…</p>`;const d=await get("/api/fixtures?date="+date);window.last=d.response;a.innerHTML=`<input type="date" value="${date}" onchange="date=this.value;draw()">`+(d.errors&&Object.keys(d.errors).length?'<p class="note">Data error: check your API key.</p>':list(d.response))}
else if(tab==="live"){a.innerHTML='<p class="note">Loading…</p>';const d=await get("/api/live");window.last=d.response;a.innerHTML=list(d.response)}
else if(tab==="table"){a.innerHTML=`<select onchange="league=this.value;draw()">${LG.map(l=>`<option value="${l[0]}" ${l[0]==league?"selected":""}>${l[1]}</option>`).join("")}</select><p class="note">Loading…</p>`;const d=await get("/api/standings?league="+league);const t=d.response?.[0]?.league?.standings?.[0]||[];
a.innerHTML=a.querySelector("select").outerHTML+`<div class="card"><table><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Pts</th></tr>${t.map(r=>`<tr><td>${r.rank}</td><td>${esc(r.team.name)}</td><td>${r.all.played}</td><td>${r.all.win}</td><td>${r.all.draw}</td><td>${r.all.lose}</td><td><b>${r.points}</b></td></tr>`).join("")||'<tr><td colspan="7" class="note">No data</td></tr>'}</table></div>`}
else{a.innerHTML=user?`<div class="card"><b>${esc(user)}</b><p class="note">${favs.length} starred matches</p><button class="btn" onclick="token='';localStorage.jt='';user=null;favs=[];draw()">Log out</button></div>`:
`<div class="card"><b>Sign up / Log in</b><input id="un" placeholder="Username" maxlength="20"><input id="pw" type="password" placeholder="Password (6+ characters)"><button class="btn pri" onclick="auth('signup')">Sign up</button> <button class="btn" onclick="auth('login')">Log in</button><p id="er" class="note"></p></div>`}}
async function auth(k){const r=await post("/api/"+k,{name:$("#un").value.trim(),pass:$("#pw").value});if(r.token){token=r.token;localStorage.jt=token;user=r.name;favs=r.favs;draw()}else $("#er").textContent=r.error||"Failed"}
(async()=>{if(token){const m=await post("/api/me",{}).catch(()=>({}));if(m.name){user=m.name;favs=m.favs}}draw()})();
</script></body></html>
